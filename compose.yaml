services:
  web:
    build: .
    ports:
      - "127.0.0.1:${GALLERY_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8081}
      DATA_DIR: /data
    volumes:
      - gallery-data:/data
    restart: unless-stopped
volumes:
  gallery-data:
